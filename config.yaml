output_dir: data
extent: {west: -125.0, south: 24.0, east: -66.0, north: 50.0}   # CONUS incl. Florida
png_width: 1180

# Each layer: where the data lives, how to read it, how to grid/colour/QC it.
# reader: grib_idx (byte-range GRIB2 via .idx) | grib_gz (gzipped GRIB2) | goes_nc (GOES ABI netCDF)
# time:   forecast (one model run, several forecast hours) | observed (latest N files)
temp_stops: &tstops [[-20,[145,0,165]],[0,[60,40,200]],[20,[40,120,240]],[32,[120,200,255]],[45,[60,190,110]],[60,[240,230,60]],[75,[250,150,40]],[90,[220,40,30]],[110,[130,0,20]]]
dbz_stops: &dbz [[5,[4,233,231]],[10,[1,159,244]],[15,[3,0,244]],[20,[2,253,2]],[25,[1,197,1]],[30,[0,142,0]],[35,[253,248,2]],[40,[229,188,0]],[45,[253,149,0]],[50,[253,0,0]],[55,[212,0,0]],[60,[188,0,0]],[65,[248,0,253]],[70,[152,84,198]]]

models:
  - name: gfs
    label: "NOAA GFS 0.25° · 2 m temperature"
    short: "GFS temp"
    product: "GFS 0.25° pgrb2 · TMP:2 m above ground"
    credit: "NOAA/NCEP Global Forecast System (GFS)"
    time: forecast
    reader: grib_idx
    bucket_url: https://noaa-gfs-bdp-pds.s3.amazonaws.com
    key_template: "gfs.{date}/{cycle}/atmos/gfs.t{cycle}z.pgrb2.0p25.f{fh:03d}"
    cycles: ["18", "12", "06", "00"]
    variable: {match: ":TMP:2 m above ground:", short: t2m}
    forecast_hours: {start: 0, end: 48, step: 3}
    lon_0_360: true
    offset: -273.15            # K -> degC (COG units)
    units: degC
    grid_res_deg: 0.25
    resampling: nearest
    json_grid_step_deg: 1.0
    qc: {min: -80, max: 60, max_nan_frac: 0}
    stale_hours: 12
    style: {units: "°F", display_scale: 1.8, display_offset: 32, stops: *tstops, ticks: [-20,0,32,60,90,110], alpha: 190}

  - name: hrrr
    label: "NOAA HRRR 3 km · composite reflectivity (forecast)"
    short: "HRRR radar fcst"
    product: "HRRR CONUS wrfsfc · REFC:entire atmosphere"
    credit: "NOAA/NCEP High-Resolution Rapid Refresh (HRRR)"
    time: forecast
    reader: grib_idx
    bucket_url: https://noaa-hrrr-bdp-pds.s3.amazonaws.com
    key_template: "hrrr.{date}/conus/hrrr.t{cycle}z.wrfsfcf{fh:02d}.grib2"
    cycles: ["23","22","21","20","19","18","17","16","15","14","13","12","11","10","09","08","07","06","05","04","03","02","01","00"]
    variable: {match: ":REFC:entire atmosphere:"}
    forecast_hours: {start: 0, end: 12, step: 2}
    nodata_values: [-999, 9999]
    units: dBZ
    grid_res_deg: 0.05         # downsampled from native 3 km to keep the repo small
    json_grid_step_deg: 0.25
    qc: {min: -40, max: 90, max_nan_frac: 0.05}
    stale_hours: 3
    style: {units: "dBZ", stops: *dbz, ticks: [5,20,35,50,65], alpha: 210, transparent_below: 5}

  - name: mrms
    label: "NOAA MRMS · merged composite reflectivity (observed)"
    short: "MRMS radar"
    product: "MRMS CONUS MergedReflectivityQCComposite_00.50"
    credit: "NOAA NSSL/NCEP Multi-Radar/Multi-Sensor System (MRMS)"
    time: observed
    reader: grib_gz
    bucket_url: https://noaa-mrms-pds.s3.amazonaws.com
    prefix_template: "CONUS/MergedReflectivityQCComposite_00.50/%Y%m%d/MRMS_MergedReflectivityQCComposite_00.50_%Y%m%d-%H"
    key_regex: "\\.grib2\\.gz$"
    time_regex: "_(\\d{8}-\\d{6})\\.grib2"
    time_format: "%Y%m%d-%H%M%S"
    frames: 6
    spacing_min: 10
    nodata_values: [-999]   # -999 = no radar coverage; -99 = covered, no echo
    units: dBZ
    grid_res_deg: 0.02
    resampling: max
    json_grid_step_deg: 0.25
    qc: {min: -100, max: 100, max_nan_frac: 0.5}
    stale_hours: 1
    style: {units: "dBZ", stops: *dbz, ticks: [5,20,35,50,65], alpha: 220, transparent_below: 5}

  - name: goes
    label: "NOAA GOES-19 ABI · band 13 clean IR (10.3 µm)"
    short: "GOES IR"
    product: "GOES-19 ABI-L2-CMIPC band 13 (CMI brightness temperature)"
    credit: "NOAA GOES-R Series / NESDIS (GOES-19 ABI)"
    time: observed
    reader: goes_nc
    bucket_url: https://noaa-goes19.s3.amazonaws.com
    prefix_template: "ABI-L2-CMIPC/%Y/%j/%H/OR_ABI-L2-CMIPC-M6C13_G19_"
    key_regex: "\\.nc$"
    time_regex: "_s(\\d{11})\\d+_e"
    time_format: "%Y%j%H%M"
    frames: 6
    spacing_min: 10
    variable: CMI
    offset: -273.15            # K -> degC
    units: degC
    grid_res_deg: 0.05         # downsampled from native 2 km to keep the repo small
    json_grid_step_deg: 0.25
    qc: {min: -110, max: 60, max_nan_frac: 0.05}
    stale_hours: 1
    style: {units: "°C", stops: [[-80,[255,255,255]],[-70,[200,0,200]],[-60,[255,0,0]],[-50,[255,200,0]],[-40,[0,200,0]],[-30,[0,120,255]],[-20,[230,230,230]],[0,[150,150,150]],[20,[60,60,60]],[40,[10,10,10]]], ticks: [-80,-60,-40,-20,0,20,40], alpha: 200}
